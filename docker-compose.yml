services:
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: aio-sandbox
    ports:
      - "8080:8080"
    volumes:
      - ./skills:/workspace/skills
      - ./MS_Paint_Reasoning_Evaluation/MS_paint_images:/workspace/MS_paint_images
      - ./screenshots:/workspace/screenshots
    environment:
      - WORKSPACE=/workspace
      - SANDBOX_SCREENSHOT_DIR=/workspace/screenshots
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    restart: unless-stopped