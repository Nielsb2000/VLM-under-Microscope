services:
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: aio-sandbox
    security_opt:
      - seccomp=unconfined
    ports:
      - "8080:8080"
    volumes:
      - ./skills:/mnt/skills
      - ./pizza_not_pizza:/mnt/pizza_not_pizza
      #  - <host path>:<container path>[:ro]

    environment:
      AIO_SKILLS_PATH: /mnt/skills
    tty: true
    stdin_open: true
